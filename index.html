<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIT TIMER">
  <title>FIT TIMER - 運動計時器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=12">
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
  <main class="app">
    <div class="top"><div class="logo">● FIT TIMER</div><span id="status-pill">READY</span></div>
    <h1>運動計時器</h1>
    <p class="subtitle">專注每一秒，完成每一組</p>
    <section class="timer-card">
      <div class="round" id="round-label">第 1 / 5 組</div>
      <div class="ring" id="ring">
        <div class="ring-inner">
          <span id="phase-label">預備時間</span>
          <div id="time-label">00:10</div>
          <span id="hint">按下開始，進入預備倒數</span>
        </div>
      </div>
      <div class="progress"><div id="progress-fill"></div></div>
    </section>
    <div class="actions">
      <button id="start-btn" class="primary" disabled>正在載入 Python…</button>
      <button id="reset-btn" class="secondary">重設</button>
    </div>
    <section class="settings">
      <h2>訓練設定</h2>
      <div class="setting"><span>預備時間</span><div class="stepper"><button id="prep-minus">−</button><strong id="prep-value">10 秒</strong><button id="prep-plus">+</button></div></div>
      <div class="setting"><span>運動時間</span><div class="stepper"><button id="work-minus">−</button><strong id="work-value">40 秒</strong><button id="work-plus">+</button></div></div>
      <div class="setting"><span>休息時間</span><div class="stepper"><button id="rest-minus">−</button><strong id="rest-value">20 秒</strong><button id="rest-plus">+</button></div></div>
      <div class="setting"><span>訓練組數</span><div class="stepper"><button id="round-minus">−</button><strong id="round-value">5 組</strong><button id="round-plus">+</button></div></div>
      <div class="setting wake-setting">
        <label for="keep-awake">運動時螢幕常亮</label>
        <input type="checkbox" id="keep-awake" checked>
      </div>
      <p class="wake-status" id="wake-status" role="status">計時開始後嘗試保持螢幕亮起</p>
    </section>
    <p class="footnote">語音使用英文。鎖定畫面、低耗電模式或離開 App 時，iOS 仍可能停止螢幕常亮與語音。</p>
  </main>

  <script>
    (() => {
      let wakeSentinel = null;
      let wakeRequesting = false;
      let active = false;
      let enabled = true;
      let generation = 0;
      const checkbox = document.getElementById('keep-awake');
      const status = document.getElementById('wake-status');
      const supported = !!navigator.wakeLock?.request;

      function show(text) { status.textContent = text; }

      async function releaseWake() {
        generation++;
        const previous = wakeSentinel;
        wakeSentinel = null;
        if (previous) {
          try { await previous.release(); } catch (_) {}
        }
      }

      async function acquireWake() {
        if (!enabled || !active || document.visibilityState !== 'visible') return;
        if (!supported) { show('此瀏覽器不支援螢幕常亮'); return; }
        if (wakeSentinel && !wakeSentinel.released) return;
        if (wakeRequesting) return;
        const requestGeneration = generation;
        wakeRequesting = true;
        try {
          const lock = await navigator.wakeLock.request('screen');
          if (requestGeneration !== generation || !enabled || !active) {
            await lock.release();
            return;
          }
          wakeSentinel = lock;
          show('螢幕常亮已啟用');
          lock.addEventListener('release', () => {
            if (wakeSentinel === lock) {
              wakeSentinel = null;
              if (active && enabled) show('螢幕常亮已被系統解除');
            }
          });
        } catch (error) {
          show('無法啟用螢幕常亮（請檢查省電設定）');
          console.warn('Wake lock:', error);
        } finally {
          wakeRequesting = false;
        }
      }

      window.setTimerRunning = (isRunning) => {
        active = Boolean(isRunning);
        if (active && enabled) {
          void acquireWake();
        } else {
          void releaseWake();
          show(enabled ? '計時暫停／結束，恢復自動鎖定' : '螢幕常亮已關閉');
        }
      };

      checkbox.addEventListener('change', () => {
        enabled = checkbox.checked;
        if (enabled && active) {
          void acquireWake();
        } else {
          void releaseWake();
          show(enabled ? '計時開始後嘗試保持螢幕亮起' : '螢幕常亮已關閉');
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && active && enabled) {
          void acquireWake();
        }
      });
    })();
  </script>
  <script type="py" src="./main.py?v=12"></script>
</body>
</html>
