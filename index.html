
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIT TIMER">

  <title>FIT TIMER - 運動計時器</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="style.css?v=11">
  <link rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module"
          src="https://pyscript.net/releases/2026.7.3/core.js">
  </script>
</head>

<body>
  <main class="app">

    <div class="top">
      <div class="logo">● FIT TIMER</div>
      <span id="status-pill">READY</span>
    </div>

    <h1>運動計時器</h1>
    <p class="subtitle">專注每一秒，完成每一組</p>

    <section class="timer-card">
      <div class="round" id="round-label">
        第 1 / 5 組
      </div>

      <div class="ring" id="ring">
        <div class="ring-inner">
          <span id="phase-label">預備時間</span>
          <div id="time-label">00:10</div>
          <span id="hint">按下開始，進入預備倒數</span>
        </div>
      </div>

      <div class="progress">
        <div id="progress-fill"></div>
      </div>
    </section>

    <section class="settings">
      <h2>訓練設定</h2>

      <div class="setting">
        <span>預備時間</span>
        <div class="stepper">
          <button id="prep-minus">−</button>
          <strong id="prep-value">10 秒</strong>
          <button id="prep-plus">+</button>
        </div>
      </div>

      <div class="setting">
        <span>運動時間</span>
        <div class="stepper">
          <button id="work-minus">−</button>
          <strong id="work-value">40 秒</strong>
          <button id="work-plus">+</button>
        </div>
      </div>

      <div class="setting">
        <span>休息時間</span>
        <div class="stepper">
          <button id="rest-minus">−</button>
          <strong id="rest-value">20 秒</strong>
          <button id="rest-plus">+</button>
        </div>
      </div>

      <div class="setting">
        <span>訓練組數</span>
        <div class="stepper">
          <button id="round-minus">−</button>
          <strong id="round-value">5 組</strong>
          <button id="round-plus">+</button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="start-btn" class="primary" disabled>
        正在載入 Python…
      </button>
      <button id="reset-btn" class="secondary">
        重設
      </button>
    </div>

    <p class="footnote">
      請開啟 iPhone 音量並保持畫面開啟。
      鎖定螢幕時 iOS 可能限制語音播放。
    </p>

  </main>

  <script type="py" src="./main.py?v=11"></script>
</body>
</html>
